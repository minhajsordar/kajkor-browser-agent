<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Agent — Schemas</title>
    <link rel="stylesheet" href="schemas.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="dot"></span><h1>Data Schemas</h1></div>
      <span id="conn" class="conn">…</span>
    </header>

    <div class="layout">
      <section class="card form-card">
        <p class="section-title">New schema</p>
        <label class="lbl">Name</label>
        <input id="name" class="input" placeholder="e.g. FB Pages" />

        <div class="fields-head">
          <span class="lbl">Fields</span>
          <button id="presetFb" class="btn xs">Facebook page preset</button>
        </div>
        <div id="fields" class="fields"></div>
        <button id="addField" class="btn sm">+ Add field</button>

        <div class="row" style="margin-top:14px">
          <button id="createBtn" class="btn primary">Create schema</button>
          <span id="formMsg" class="msg"></span>
        </div>
      </section>

      <section class="list-card">
        <p class="section-title">Existing schemas</p>
        <div id="list" class="schema-list"></div>
      </section>
    </div>

    <script src="schemas.js"></script>
  </body>
</html>
