<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Browser Agent — Tasks</title>
    <link rel="stylesheet" href="dashboard.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="dot"></span><h1>Browser Agent — Tasks</h1></div>
      <div class="top-actions">
        <span id="conn" class="conn">…</span>
        <button id="refreshBtn" class="btn sm">↻ Refresh</button>
      </div>
    </header>

    <div class="layout">
      <aside class="list-pane">
        <div class="filters">
          <input id="search" class="input" placeholder="Search tasks…" />
          <select id="statusFilter" class="select">
            <option value="">All status</option>
            <option value="running">Running</option>
            <option value="checking">Checking</option>
            <option value="planning">Planning</option>
            <option value="done">Done</option>
            <option value="error">Error</option>
            <option value="stopped">Stopped</option>
          </select>
        </div>
        <ul id="taskList" class="task-list"></ul>
      </aside>

      <main id="preview" class="preview-pane">
        <div class="empty">Select a task to preview.</div>
      </main>
    </div>

    <script src="dashboard.js"></script>
  </body>
</html>
